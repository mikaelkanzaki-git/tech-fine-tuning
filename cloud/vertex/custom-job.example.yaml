displayName: qwen3-4b-medquad-smoke
jobSpec:
  workerPoolSpecs:
    - machineSpec:
        machineType: n1-standard-8
        acceleratorType: NVIDIA_TESLA_T4
        acceleratorCount: 1
      replicaCount: 1
      containerSpec:
        imageUri: REGION-docker.pkg.dev/PROJECT/REPOSITORY/tech-fine-tuning:TAG
        command: ["python", "-m", "tech_fine_tuning"]
        args:
          - train
          - --config
          - configs/qwen3-4b/smoke.toml
          - --source
          - /gcs/BUCKET/datasets/medquad-sft
          - --output
          - /gcs/BUCKET/runs/qwen3-4b-medquad-smoke
          - --producer-commit
          - REPLACE_WITH_THE_40_CHARACTER_GIT_COMMIT
