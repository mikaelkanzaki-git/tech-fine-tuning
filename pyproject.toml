[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tech-fine-tuning"
version = "0.1.0"
description = "Preparação, fine-tuning e avaliação do modelo médico do Tech Challenge."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "FIAP Tech Challenge - Grupo" },
]
dependencies = []

[project.optional-dependencies]
training = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "unsloth==2026.8.22",
]

[project.scripts]
tech-fine-tuning = "tech_fine_tuning.runner:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tech_fine_tuning"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider --cov=src/tech_fine_tuning --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/tech_fine_tuning/runner.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
omit = [
  "src/tech_fine_tuning/runner.py",
  "src/tech_fine_tuning/integrations/training/unsloth.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
